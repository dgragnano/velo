# Workflow de Integração Contínua focado exclusivamente na execução
# de testes unitários. Estrutura preparada para expansão futura.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: dgragnanos-projects

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Realiza o checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js utilizada no workflow
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o lockfile do Yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Baixa as configurações de build do ambiente Preview da Vercel.
      - name: Pull Vercel Config (Preview)
        run: |
          yarn vercel pull --yes \
          --environment=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      # 6. Sobrescreve .vercel/.env.preview.local com as variáveis do Supabase de preview.
      #    O `vercel build` lê ESTE arquivo para injetar vars no processo de build.
      #    Sobrescrevendo após o pull, garantimos que nenhuma var de produção
      #    vaze para o bundle de preview (independente do escopo configurado na Vercel).
      - name: Override Vercel preview env with preview Supabase vars
        run: |
          printf "VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PROJECT_ID=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n" \
            "${{ secrets.SUPABASE_PREVIEW_URL }}" \
            "${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}" \
            "${{ secrets.SUPABASE_PREVIEW_PUBLISHABLE_KEY }}" > .vercel/.env.preview.local

      # 7. Build com as variáveis do Supabase de preview embutidas no bundle
      - name: Build Vercel (Preview)
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 8. Deploy preview no Vercel
      - name: Deploy preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt \
          --target=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Instalação do Chromium
      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      # 6. Execução dos Testes de Regressão.
      #    BASE_URL aponta para o deploy de preview (bundle com Supabase de preview).
      #    DATABASE_URL aponta para o banco de preview via Session Pooler (SSL) —
      #    produção jamais é tocada.
      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          DATABASE_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}

      # 7. Relatório de Testes Automatizados
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

      # 8. Publicar report JSON do TestDino
      - name: Publish Testdino Report
        if: ${{ !cancelled() }}
        run: npx tdpw upload ./playwright-report --token=${{ secrets.TESTDINO_TOKEN }}

  deploy-production:
    name: Deploy to Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Baixa as configurações do ambiente Production da Vercel.
      #    As VITE_SUPABASE_* de produção são baixadas via vercel pull.
      #    Um build dedicado garante que o bundle de produção nunca carrega
      #    as variáveis do Supabase de preview.
      - name: Pull Vercel Config (Production)
        run: |
          yarn vercel pull --yes \
          --environment=production \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      # 6. Build com as variáveis do Supabase de PRODUÇÃO embutidas no bundle
      - name: Build Vercel (Production)
        run: yarn vercel build --prod --token=$VERCEL_TOKEN

      # 7. Deploy direto para produção
      - name: Deploy to Production
        run: |
          yarn vercel deploy --prebuilt \
          --prod \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE \
          --yes
